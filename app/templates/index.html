{% extends "base.html" %}
{% block content %}
<h1>Pick a chair</h1>
<p class="lead">The app reads the model plate, finds the maker's manual and builds the chair's passport.</p>
<div class="picker">
  {% for c in cards %}
  <a class="card pick-card" href="/build/{{ c.chair.chair_id }}">
    <img src="/photo/{{ c.chair.chair_id }}/front.jpg" alt="Front view of a wheelchair">
    <div class="pick-body">
      <span class="pick-id">{{ c.chair.chair_id|replace('-', ' ')|title }}</span>
      <span class="pick-name">{{ c.name or "Model not read yet" }}</span>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
